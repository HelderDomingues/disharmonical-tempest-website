pt: >-
  Pioneira do Death Metal Melódico no Brasil, a Disharmonical Tempest nasceu
  em Campo Grande (MS) nos anos 1990 e ajudou a construir o cenário do metal
  extremo nacional para além do eixo Rio–São Paulo–Minas. A demo tape
  Diatessaron, gravada de forma independente em 1998, rodou o mundo e é ouvida
  até hoje em vários países; em 2001, a banda entrou na coletânea The Winds of
  a New Millennium Vol.3, da Demise Records, com a música Castaway Requiem.

  Depois de mais de duas décadas de pausa, o reencontro com a própria história
  veio em 2024, com o convite para o documentário Barulho do Mato, sobre a
  trajetória do heavy metal no Mato Grosso do Sul. O retorno se tornou
  inevitável: no ano em que completa 30 anos de trajetória, a banda encerra o
  silêncio com seu primeiro EP oficial — autointitulado, produzido por Tarsos
  Morais e lançado pela AKASHA Records em 18 de setembro de 2026, com cinco
  composições históricas regravadas com a produção que sempre desejaram.

  O resultado une o peso e a agressividade de guitarras e bateria imponentes à
  harmonia clássica e erudita dos teclados, marca registrada do grupo, com
  vocais guturais intensos e arranjos que evoluíram junto com seus integrantes.

en: >-
  A pioneer of Melodic Death Metal in Brazil, Disharmonical Tempest was formed
  in Campo Grande (MS) in the 1990s and helped build the national extreme metal
  scene beyond the Rio–São Paulo–Minas axis. The independent 1998 demo tape
  Diatessaron traveled the world and is still heard in several countries; in
  2001 the band appeared on the compilation The Winds of a New Millennium
  Vol.3 (Demise Records) with the song Castaway Requiem.

  After more than two decades of silence, the encounter with its own history
  came in 2024, when the band was invited to take part in the documentary
  Barulho do Mato, about the heavy metal scene of Mato Grosso do Sul. The
  return became inevitable: in the year it celebrates 30 years, the band
  breaks the silence with its first official EP — self-titled, produced by
  Tarsos Morais and released via AKASHA Records on September 18, 2026, with
  five historical compositions re-recorded with the production they always
  dreamed of.

  The result combines the weight and aggression of imposing guitars and drums
  with the classical, erudite harmony of the keyboards — the band's signature
  — plus intense guttural vocals and arrangements that evolved along with its
  members.
